app:
  datasource:
    batch:
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      username: sa
    bill:
      driver-class-name: org.h2.Driver
      jdbc-url: "jdbc:h2:mem:billdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=RUNSCRIPT FROM 'classpath:schema/bill.sql'"
      username: sa
    customer:
      driver-class-name: org.h2.Driver
      jdbc-url: "jdbc:h2:mem:customerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=RUNSCRIPT FROM 'classpath:schema/customer.sql'"
      username: sa

