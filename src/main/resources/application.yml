spring:
  application:
    name: spring-batch-gradle-sample
  batch:
    jdbc:
      initialize-schema: always
    job:
      name: billingNdjsonJob

app:
  batch:
    chunk-size: 1000
    page-size: 1000
  datasource:
    batch:
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      username: sa
    bill:
      driver-class-name: org.h2.Driver
      jdbc-url: "jdbc:h2:mem:billdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=RUNSCRIPT FROM 'classpath:sql/bill-schema.sql'"
      username: sa
    customer:
      driver-class-name: org.h2.Driver
      jdbc-url: "jdbc:h2:mem:customerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=RUNSCRIPT FROM 'classpath:sql/customer-schema.sql'"
      username: sa
